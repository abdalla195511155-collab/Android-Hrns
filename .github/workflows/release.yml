name: Release build

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/release.yml"

permissions:
  contents: write

concurrency:
  group: release-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (caching)
        uses: gradle/actions/setup-gradle@v6

      # The runner image no longer ships the NDK version pinned in
      # app/build.gradle.kts, and AGP refuses to configure without it.
      - name: Install pinned NDK
        run: "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager --install 'ndk;27.2.12479018'"

      - name: Install Vulkan shader compiler
        run: sudo apt-get update && sudo apt-get install -y glslc

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Stamp APK with date + commit
        id: apk
        run: |
          STAMP=$(date -u +%Y%m%d-%H%M)
          SHA=$(git rev-parse --short HEAD)
          NAME="AndroidHarness-${STAMP}-${SHA}-release.apk"
          mkdir dist && cp app/build/outputs/apk/release/app-release.apk "dist/${NAME}"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact (Actions tab, kept 30 days)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apk.outputs.name }}
          path: dist/*
          retention-days: 30
